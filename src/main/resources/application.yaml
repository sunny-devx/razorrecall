spring:
  application:
    name: razorrecall

  datasource:
    url: jdbc:postgresql://localhost:5432/razorrecall
    username: sunny.
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

razorrecall:
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET:test_webhook_secret_key_12345}
  guardrails:
    max-recovery-amount: 500000.00
  razorpay:
    mode: ${RAZORPAY_MODE:mock}
    key-id: ${RAZORPAY_KEY_ID:rzp_test_dummy}
    key-secret: ${RAZORPAY_KEY_SECRET:dummy_secret}
    base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.0-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      timeout-ms: 3000
  scheduler:
    enabled: ${RECOVERY_SCHEDULER_ENABLED:false}
    eval-interval-ms: 10000
    dispatch-interval-ms: 15000
    expire-interval-ms: 60000
    expiry-window-hours: 24
